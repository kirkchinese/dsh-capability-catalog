# Curated REA 6.7.0 families. Order matters: the first matching family wins.
- name: session
  description: 'open/close a target, provider binding, readiness and navigation context'
  match: [open_binary, close_binary, binary_session, binary_overview, get_navigation_context, list_documents, current_document, list_architectures]
- name: native-code
  description: 'functions, pseudocode, assembly, call graph and references in native binaries (Hopper/Ghidra/IDA)'
  match: [procedure_*, list_procedures, search_procedures, current_procedure, resolve_containing_procedure, analyze_function, batch_decompile, read_function_instructions, get_call_graph, build_call_path, trace_call_path, xrefs, find_xrefs_to_name, resolve_native_call_targets, trace_native_values, compare_functions, inspect_native_*, inspect_address_context]
- name: native-navigation
  description: 'addresses, bytes, strings, names, segments, comments and bookmarks'
  match: ['*address*', goto_address, next_address, prev_address, read_bytes, search_bytes, list_strings, search_strings, list_names, list_segments, '*comment*', '*bookmark*', annotate_native_function]
- name: native-formats
  description: 'Mach-O, PE, ELF layout, signatures, Go/Rust/Swift/ObjC metadata, objdump and rizin'
  match: [inspect_macho, inspect_pe_resources, inspect_binary_layout, inspect_signature, inspect_go_binary, inspect_rust_binary, '*swift*', get_objc_*, inspect_native_dispatch_metadata, inspect_with_objdump, execute_rizin_command, cutter_command, list_cutter_sessions, trace_dylib_resolution, inspect_dart_aot, identify_flutter_build, inspect_wasm_artifact, compare_wasm_interfaces, inspect_evm_interface]
- name: javascript-electron
  description: 'JavaScript/Electron apps, bundles, source maps, IPC and runtime tracing'
  match: ['*javascript*', analyze_web_bundle, recover_javascript_sources, compare_source_to_bundle, compare_bundles, '*electron*', trace_application_feature, trace_feature, compare_application_versions]
- name: web-browser
  description: 'live pages through a Chrome-family browser, network captures, screenshots and WebMCP'
  match: ['*web*', capture_browser_scenario, list_browser_targets]
- name: android
  description: 'APKs, classes, methods, resources (JADX, Apktool, JEB) and app graphs'
  match: ['*android*', inspect_apktool_client, '*jeb*']
- name: adb-device
  description: 'attached Android devices over adb: packages, files, logs, screens and app control'
  match: ['*adb*']
- name: managed-dotnet
  description: '.NET assemblies, members, native boundaries and reconstruction'
  match: ['*managed*']
- name: apple-bundles
  description: 'plists, keyed archives, asset catalogs, Interface Builder and Apple/Harmony app graphs'
  match: [inspect_plist, inspect_keyed_archive, inspect_asset_catalog, decode_interface_builder, project_apple_application_graph, project_harmony_application_graph]
- name: artifacts
  description: 'archives, packages, firmware, SQLite and file-level comparisons'
  match: [inspect_artifact, extract_artifact, compare_artifacts, inspect_firmware_regions, extract_firmware, inspect_sqlite_database, inspect_analysis_view]
- name: runtime-debug
  description: 'Frida, GDB and rizin debugging, process and native UI capture, recorded crashes'
  match: ['*frida*', '*gdb*', '*rizin_debug*', capture_process_scenario, compare_process_captures, observe_native_*, capture_native_ui_scenario, trace_native_ui_action, inspect_recorded_crash, correlate_static_and_runtime, find_changed_behavior]
- name: captures-signals
  description: 'pcap/pcapng packets and recorded logic signals'
  match: ['*pcap*', '*packet*', '*signal*']
- name: evidence
  description: 'evidence bundles, residual unknowns and reconstruction verification'
  match: ['*evidence*', '*unknown*', '*reconstruction*']
