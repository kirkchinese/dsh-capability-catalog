<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root { --blue:#4d6bfe; --cyan:#5ad1ff; --amber:#f4a261; --red:#e76f51; --ink:#05070f; }
  html,body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--ink); color:#fff;
    font-family:"Noto Sans","Noto Sans CJK SC",sans-serif; }
  .layer { position:absolute; inset:0; will-change:transform,opacity; }
  .img { position:absolute; inset:-6%; background-size:cover; background-position:center; }
  .vignette { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 75% 70% at 50% 50%, rgba(5,7,15,0) 40%, rgba(5,7,15,.85) 100%); }
  .center { position:absolute; left:0; right:0; text-align:center; }
  .h1 { font-size:84px; font-weight:800; letter-spacing:-.01em; }
  .h2 { font-size:56px; font-weight:800; }
  .zh { font-family:"Noto Sans CJK SC","Noto Sans",sans-serif; }
  .sub { font-size:30px; color:#c9d3f2; text-shadow:0 2px 18px rgba(0,0,0,.95), 0 0 4px rgba(0,0,0,.8); }
  .center { text-shadow:0 2px 24px rgba(0,0,0,.8); }
  .mono { font-family:"Noto Sans Mono","DejaVu Sans Mono",monospace; }
  .rain span { position:absolute; font-family:"Noto Sans Mono","DejaVu Sans Mono",monospace; white-space:nowrap; }
  .counter { font-size:150px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .panel { position:absolute; border-radius:22px; background:rgba(9,14,34,.78); border:1px solid rgba(120,145,255,.28);
    box-shadow:0 30px 90px rgba(0,0,0,.55), 0 0 60px rgba(77,107,254,.12); backdrop-filter:blur(10px); overflow:hidden; }
  .panel h4 { margin:0; padding:18px 26px; font-size:22px; color:#9fb4ff; letter-spacing:.06em; border-bottom:1px solid rgba(120,145,255,.18); }
  .code { padding:18px 26px; font-size:21px; line-height:1.62; color:#d8e0ff; white-space:pre; }
  .code .k { color:#7ea0ff; } .code .d { color:#7b86ad; } .code .g { color:#7be0b0; } .code .a { color:#ffc48a; }
  .chip { position:absolute; padding:16px 26px; border-radius:16px; font-size:28px; font-weight:700;
    background:rgba(12,20,52,.85); border:1.5px solid rgba(120,145,255,.4); }
  .bar { position:absolute; height:64px; border-radius:12px; }
  .label { position:absolute; font-size:30px; color:#c9d1ee; }
  .num { position:absolute; font-size:46px; font-weight:800; font-variant-numeric:tabular-nums; }
  .shot { position:absolute; border-radius:18px; overflow:hidden; box-shadow:0 40px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08); }
  .shot img { display:block; width:100%; }
  .tag { position:absolute; padding:10px 22px; border-radius:999px; font-size:26px; background:rgba(10,16,40,.7); border:1px solid rgba(120,145,255,.4); color:#dfe6ff; white-space:nowrap; }
  .cmd { display:inline-block; padding:20px 34px; border-radius:16px; background:rgba(8,12,30,.85); border:1px solid rgba(120,145,255,.35); font-size:30px; color:#e5ebff; }
  .cmd b { color:#7ea0ff; font-weight:600; }
  .flash { position:absolute; inset:0; background:#cfe0ff; mix-blend-mode:screen; }
  .bars { position:absolute; left:0; right:0; height:0; background:#000; }
</style></head>
<body>
<div id="stage"></div>
<script>
// ------------------------------------------------------------------ helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const lerp = (a, b, k) => a + (b - a) * k
const ease = (k) => (k = clamp(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2)
const easeOut = (k) => 1 - Math.pow(1 - clamp(k), 3)
const prog = (t, a, b) => clamp((t - a) / (b - a))
// Fade window: in over [a, a+i], out over [b-o, b].
const win = (t, a, b, i = .6, o = .6) => Math.min(prog(t, a, a + i), 1 - prog(t, b - o, b))
function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296 }
const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild }
const stage = document.getElementById('stage')
const add = (html) => stage.appendChild(el(html))
const fmt = (n) => Math.round(n).toLocaleString('en-US')

const SRC = '../source/'
const ASSETS = '../../docs/assets/'

// ------------------------------------------------------------------ layers
const bgBackdrop = add(`<div class="layer"><div class="img" style="background-image:url(${SRC}backdrop.png)"></div></div>`)
const bgOverflow = add(`<div class="layer"><div class="img" style="background-image:url(${SRC}overflow.png)"></div></div>`)
const bgHero = add(`<div class="layer"><div class="img" style="background-image:url(${SRC}hero.png)"></div></div>`)
const bgCalm = add(`<div class="layer"><div class="img" style="background-image:url(${SRC}calm.png)"></div></div>`)
const bgReverse = add(`<div class="layer"><div class="img" style="background-image:url(${SRC}reverse.png)"></div></div>`)
const dim = add(`<div class="layer" style="background:#05070f;opacity:0"></div>`)
const dimLeft = add(`<div class="layer" style="background:linear-gradient(90deg,rgba(5,7,15,.88),rgba(5,7,15,.55) 45%,rgba(5,7,15,0) 75%);opacity:0"></div>`)
add(`<div class="vignette"></div>`)

// Scene 1 text
const s1a = add(`<div class="center zh h2" style="top:420px">每一次请求，</div>`)
const s1b = add(`<div class="center zh h1" style="top:510px">都背着 <span style="color:#ffb27a">207</span> 个工具。</div>`)

// Scene 2: tool-name rain and counter
const rain = add(`<div class="layer rain"></div>`)
const names = TOOL_NAMES
const R = rng(7)
const drops = []
for (let i = 0; i < 150; i++) {
  const span = document.createElement('span')
  span.textContent = names[i % names.length]
  const size = 14 + R() * 18
  span.style.fontSize = size + 'px'
  rain.appendChild(span)
  drops.push({ span, x: R() * 1920, y0: R() * 1300 - 200, speed: 120 + R() * 260, size, hue: R() })
}
const s2label = add(`<div class="center zh sub" style="top:318px;font-size:36px;font-weight:700;color:#fff">直接注册 REA，首个请求的输入 token</div>`)
const s2count = add(`<div class="center counter" style="top:380px;color:#ffd2b8">0</div>`)
const s2note = add(`<div class="center zh sub" style="top:600px;font-size:26px;color:#8f9bc4">668 KB 参数定义 · 每个会话都要先付这一笔</div>`)

// Scene 3: title
const card = add(`<div style="position:absolute;left:910px;top:490px;width:100px;height:100px;border-radius:18px;background:linear-gradient(160deg,#e9efff,#9fb4ff);box-shadow:0 0 80px rgba(120,160,255,.9)"></div>`)
const s3kicker = add(`<div class="center" style="top:300px;font-size:24px;letter-spacing:.34em;color:#9fb4ff;font-weight:600">DEEPSEEK HARNESS PLUGIN</div>`)
const s3title = add(`<div class="center h1" style="top:345px;font-size:120px;background:linear-gradient(180deg,#fff,#c9d6ff);-webkit-background-clip:text;color:transparent">Capability Catalog</div>`)
const s3zh = add(`<div class="center zh" style="top:510px;font-size:46px;font-weight:700;letter-spacing:.4em;color:#e7ecff">能力目录</div>`)
const s3sub = add(`<div class="center zh sub" style="top:600px">常驻一份几 KB 的索引，具体定义用到时才取</div>`)

// Scene 4: how it works
const s4title = add(`<div class="zh" style="position:absolute;left:120px;top:84px;font-size:44px;font-weight:800">常驻的只有索引</div>`)
const s4index = add(`<div class="panel" style="left:120px;top:170px;width:820px;height:560px">
  <h4 class="mono">SYSTEM PROMPT · ## Capability catalog</h4>
  <div class="code mono" id="idx"></div></div>`)
const INDEX_LINES = [
  `<span class="k">### mcp:rea — REA reverse engineering (207)</span>`,
  `- native-code (28)  <span class="d">functions, pseudocode, call graph…</span>`,
  `- runtime-debug (26)  <span class="d">Frida, GDB, rizin…</span>`,
  `- adb-device (24)  <span class="d">Android devices over adb</span>`,
  `- javascript-electron (17)  <span class="d">apps, bundles, IPC</span>`,
  `- web-browser (14) · android (12) · …`,
  ``,
  `<span class="k">### skills — reusable task instructions (59)</span>`,
  `- wiki (21)  <span class="d">wiki-query, wiki-ingest, …</span>`,
  `- history-ingest (7) · general (31)`,
]
const idxEl = s4index.querySelector('#idx')
const steps = [
  { name: 'capability_search', y: 170, call: `{"query": "analyze javascript electron app"}`,
    out: `<span class="g">→</span> mcp:rea/analyze_javascript_application\n  <span class="d">[javascript-electron, params 3.0 KB]</span>` },
  { name: 'capability_describe', y: 360, call: `{"id": "mcp:rea/compare_web_captures"}`,
    out: `<span class="d">166 KB schema → compact signature</span>\n  inspection: {…15 fields} <span class="a">→ /properties/…/inspection</span>` },
  { name: 'capability_call', y: 550, call: `{"id": "…analyze_javascript_application",\n  "arguments": {"input_path": "/tmp/app"}}`,
    out: `<span class="g">✓</span> validated · REA started on demand\n  main.js → require("./lib/greet")` },
]
for (const s of steps) {
  s.el = add(`<div class="panel" style="left:1000px;top:${s.y}px;width:800px;height:170px">
    <div class="code mono" style="padding:16px 24px;font-size:18px"><span class="k" style="font-weight:700;font-size:21px">${s.name}</span> <span class="d">${s.call.replace(/\n/g, '\n  ')}</span>\n${s.out}</div></div>`)
}
const s4foot = add(`<div class="center zh sub" style="top:960px;font-size:28px">工具列表整场不变 · 前缀缓存稳定 · 参数先校验再调用</div>`)

// Scene 5: numbers
const s5title = add(`<div class="zh" style="position:absolute;left:160px;top:150px;font-size:44px;font-weight:800">首个请求的输入 token</div>`)
const s5sub = add(`<div class="zh" style="position:absolute;left:160px;top:214px;font-size:24px;color:#8f9bc4">DeepSeek 官方 API · 同一任务 · 含全部系统提示与内置工具</div>`)
const l1 = add(`<div class="label" style="left:160px;top:340px">直接注册 REA</div>`)
const b1 = add(`<div class="bar" style="left:160px;top:396px;background:linear-gradient(90deg,#f4a261,#e76f51)"></div>`)
const n1 = add(`<div class="num" style="top:400px;color:#ffd2b8">0</div>`)
const l2 = add(`<div class="label" style="left:160px;top:520px">能力目录</div>`)
const b2 = add(`<div class="bar" style="left:160px;top:576px;background:linear-gradient(90deg,#4d6bfe,#5ad1ff)"></div>`)
const n2 = add(`<div class="num" style="top:580px;color:#b9c8ff">0</div>`)
const big = add(`<div class="center" style="top:730px;font-size:130px;font-weight:800;color:#5ad1ff;text-shadow:0 0 50px rgba(90,209,255,.45)">−96.6%</div>`)

// Scene 6: UI
const s6title = add(`<div class="center zh h2" style="top:70px">每个工具、每个 skill，都能单独开关</div>`)
const s6sub = add(`<div class="center zh sub" style="top:150px">全局一层 · 会话一层 · 会话优先</div>`)
const shot1 = add(`<div class="shot" style="left:150px;top:250px;width:1000px"><img src="${ASSETS}settings-card-dark.png"></div>`)
const shot2 = add(`<div class="shot" style="left:1230px;top:230px;width:540px"><img src="${ASSETS}session-popover-crop.png"></div>`)

// Scene 7: features
const s7title = add(`<div class="zh" style="position:absolute;left:120px;top:110px;font-size:56px;font-weight:800">按需启动，空闲断开</div>`)
const tags = ['MCP + Skill 统一索引', '超大 schema 签名 + JSON Pointer', '调用前按原始 schema 校验', '磁盘缓存工具清单', '空闲 5 分钟自动断开', '设置页 + 会话弹窗', 'DSH 0.2.1-rc.2 / rc.3']
  .map((text, i) => add(`<div class="tag zh" style="left:${120 + (i % 2) * 20}px;top:${230 + i * 84}px">${text}</div>`))

// Scene 8: end card
const e1 = add(`<div class="center h1" style="top:300px;font-size:100px;background:linear-gradient(180deg,#fff,#c9d6ff);-webkit-background-clip:text;color:transparent">Capability Catalog</div>`)
const e2 = add(`<div class="center zh sub" style="top:440px">让模型知道有什么，而不必背着全部</div>`)
const e3 = add(`<div class="center" style="top:540px"><div class="cmd mono"><b>$</b> dsh plugin --profile web add @kirkchinese/dsh-re-kit</div></div>`)
const e4 = add(`<div class="center mono" style="top:680px;font-size:28px;color:#9fb4ff">github.com/kirkchinese/dsh-capability-catalog</div>`)
const e5 = add(`<div class="center zh" style="top:730px;font-size:24px;color:#7b86ad">MIT · npm @kirkchinese/dsh-capability-catalog</div>`)

const flash = add(`<div class="flash" style="opacity:0"></div>`)
const barTop = add(`<div class="bars" style="top:0"></div>`)
const barBot = add(`<div class="bars" style="bottom:0"></div>`)

// ------------------------------------------------------------------ timeline
function kb(layer, t, a, b, from, to) {
  // Ken Burns: scale/translate from -> to over [a, b].
  const k = ease(prog(t, a, b))
  const s = lerp(from[0], to[0], k), x = lerp(from[1], to[1], k), y = lerp(from[2], to[2], k)
  layer.firstElementChild.style.transform = `translate(${x}px, ${y}px) scale(${s})`
}
const show = (node, o, extra = '') => { node.style.opacity = o; node.style.transform = extra; node.style.visibility = o > 0.001 ? 'visible' : 'hidden' }

window.DURATION = 60
window.render = function (t) {
  // Letterbox open at start, close at end.
  const bars = 1 - easeOut(prog(t, 0, 1.6)) + easeOut(prog(t, 58.6, 60))
  barTop.style.height = barBot.style.height = (bars * 540) + 'px'

  // Legibility overlays per scene
  dim.style.opacity = Math.max(.55 * win(t, 7.2, 13.8, .6, .6), .38 * win(t, 16, 21.4, .8, .6), .5 * win(t, 41.4, 50.2, .7, .5), .72 * win(t, 55, 60, .8, .1))
  dimLeft.style.opacity = win(t, 49.8, 55.8, .6, .6)
  // Backgrounds
  show(bgBackdrop, Math.max(win(t, 0, 7.5, .1, 1.5), win(t, 21, 34, 1, 1), win(t, 33.5, 42, .8, 1)))
  kb(bgBackdrop, t, 0, 42, [1.05, 0, 0], [1.18, -60, -20])
  show(bgOverflow, win(t, 6, 14.6, 1.4, .8))
  kb(bgOverflow, t, 6, 14.6, [1.04, 40, 10], [1.22, -40, -30])
  show(bgHero, win(t, 14.2, 21.6, .3, 1))
  kb(bgHero, t, 14.2, 21.6, [1.16, 120, 0], [1.04, -40, 0])
  show(bgCalm, Math.max(win(t, 41, 50.5, 1, 1), win(t, 55, 60, 1.2, .1)))
  kb(bgCalm, t, 41, 60, [1.2, 0, 40], [1.04, 0, -10])
  show(bgReverse, win(t, 49.6, 56, 1, 1.2))
  kb(bgReverse, t, 49.6, 56, [1.05, 60, 0], [1.16, -80, -20])

  // Scene 1
  show(s1a, win(t, 1.2, 6.4, .8, .7), `translateY(${lerp(18, 0, easeOut(prog(t, 1.2, 2.2)))}px)`)
  show(s1b, win(t, 2.4, 6.4, .8, .7), `translateY(${lerp(18, 0, easeOut(prog(t, 2.4, 3.4)))}px) scale(${lerp(1, 1.04, prog(t, 2.4, 6.4))})`)

  // Scene 2: rain then suction into the card
  const rainOn = win(t, 6.2, 16.2, .8, .4)
  rain.style.opacity = rainOn
  rain.style.visibility = rainOn > 0 ? 'visible' : 'hidden'
  const suck = ease(prog(t, 13.6, 15.6))
  for (const d of drops) {
    const y = ((d.y0 + (t - 6) * d.speed) % 1400 + 1400) % 1400 - 150
    const x = d.x + Math.sin(t * .7 + d.hue * 6) * 12
    const cx = lerp(x, 960, suck), cy = lerp(y, 540, suck)
    d.span.style.transform = `translate(${cx}px, ${cy}px) scale(${lerp(1, .2, suck)})`
    const warm = clamp((t - 9) / 4)
    const c = d.hue < .5 ? `rgba(160,180,255,${.35 + d.hue * .5})` : `rgba(${lerp(140, 255, warm) | 0},${lerp(200, 170, warm) | 0},${lerp(255, 120, warm) | 0},${.3 + d.hue * .4})`
    d.span.style.color = c
  }
  show(s2label, win(t, 7.4, 13.4, .6, .5))
  show(s2count, win(t, 7.6, 13.4, .5, .5), `scale(${1 + .04 * Math.sin(prog(t, 12, 13) * Math.PI)})`)
  s2count.textContent = fmt(249653 * easeOut(prog(t, 7.8, 12)))
  show(s2note, win(t, 9.4, 13.4, .6, .5))

  // Scene 3: the card and the title
  const cardOn = win(t, 14.6, 20.6, .4, .8)
  const fly = ease(prog(t, 15.4, 16.6))
  card.style.opacity = cardOn * (1 - prog(t, 16.2, 16.7))
  card.style.transform = `translate(${lerp(0, 560, fly)}px, ${lerp(0, 150, fly)}px) scale(${lerp(.2, 1, easeOut(prog(t, 14.6, 15.4))) * lerp(1, .35, fly)})`
  flash.style.opacity = .65 * (1 - prog(t, 14.9, 15.6)) * (t >= 14.9 ? 1 : 0)
  show(s3kicker, win(t, 16.2, 21.2, .6, .6))
  show(s3title, win(t, 16.4, 21.2, .8, .6), `scale(${lerp(.94, 1.02, prog(t, 16.4, 21.2))})`)
  show(s3zh, win(t, 17, 21.2, .7, .6), `translateY(${lerp(14, 0, easeOut(prog(t, 17, 17.8)))}px)`)
  show(s3sub, win(t, 17.8, 21.2, .7, .6))

  // Scene 4
  const s4 = win(t, 21.4, 33.4, .6, .6)
  show(s4title, s4)
  show(s4index, s4, `translateX(${lerp(-40, 0, easeOut(prog(t, 21.4, 22.4)))}px)`)
  const lines = Math.floor(lerp(0, INDEX_LINES.length + .99, prog(t, 22, 25)))
  idxEl.innerHTML = INDEX_LINES.slice(0, lines).join('\n')
  steps.forEach((s, i) => {
    const a = 25 + i * 2.4
    show(s.el, Math.min(win(t, a, 33.4, .5, .6), 1), `translateX(${lerp(60, 0, easeOut(prog(t, a, a + .7)))}px)`)
    s.el.style.borderColor = t > a && t < a + 2.4 ? 'rgba(90,209,255,.8)' : 'rgba(120,145,255,.28)'
  })
  show(s4foot, win(t, 31, 33.4, .5, .5))

  // Scene 5
  const s5 = win(t, 33.8, 41.4, .6, .6)
  for (const n of [s5title, s5sub, l1, l2]) show(n, s5)
  const w1 = 1300 * easeOut(prog(t, 34.6, 36.4))
  const w2 = Math.max(12, 1300 * (8404 / 249653)) * easeOut(prog(t, 36.6, 37.4))
  b1.style.width = w1 + 'px'; b2.style.width = w2 + 'px'
  show(b1, s5); show(b2, s5)
  n1.textContent = fmt(249653 * easeOut(prog(t, 34.6, 36.4))); n1.style.left = (160 + w1 + 24) + 'px'; show(n1, s5)
  n2.textContent = fmt(8404 * easeOut(prog(t, 36.6, 37.4))); n2.style.left = (160 + w2 + 24) + 'px'; show(n2, s5)
  show(big, win(t, 37.8, 41.4, .5, .6), `scale(${lerp(1.25, 1, easeOut(prog(t, 37.8, 38.6)))})`)

  // Scene 6
  const s6 = win(t, 41.6, 50.2, .7, .7)
  show(s6title, s6); show(s6sub, win(t, 42, 50.2, .7, .7))
  const tilt = lerp(16, 3, ease(prog(t, 41.6, 46)))
  show(shot1, s6, `perspective(1600px) rotateY(${tilt}deg) translateY(${lerp(40, 0, easeOut(prog(t, 41.6, 43)))}px) scale(${lerp(.96, 1, prog(t, 41.6, 50))})`)
  show(shot2, win(t, 43.4, 50.2, .7, .7), `perspective(1600px) rotateY(${-tilt}deg) translateY(${lerp(60, 0, easeOut(prog(t, 43.4, 44.6)))}px)`)

  // Scene 7
  const s7 = win(t, 50, 55.6, .6, .6)
  show(s7title, s7)
  tags.forEach((tag, i) => show(tag, Math.min(s7, prog(t, 50.6 + i * .32, 51.1 + i * .32)), `translateX(${lerp(-30, 0, easeOut(prog(t, 50.6 + i * .32, 51.3 + i * .32)))}px)`))

  // Scene 8
  show(e1, win(t, 55.4, 60, .9, .9), `scale(${lerp(.96, 1, prog(t, 55.4, 60))})`)
  show(e2, win(t, 56, 60, .7, .9))
  show(e3, win(t, 56.6, 60, .7, .9))
  show(e4, win(t, 57.2, 60, .6, .9))
  show(e5, win(t, 57.4, 60, .6, .9))
}
window.render(0)
</script>
</body></html>
